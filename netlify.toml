# Netlify build + functions + SPA routing config.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless API (/api/content, /api/track, /api/admin) — routing via each
# function's `export const config = { path }`. Matched before the redirects below.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serverless API → functions, BEFORE the SPA catch-all so it isn't swallowed.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pretty URL for the CMS portal (admin.html is a real file in dist/).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA fallback: serve the app for any path that isn't a real file or an API route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
